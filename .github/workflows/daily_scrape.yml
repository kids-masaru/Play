name: Daily Race Data Collection

on:
  schedule:
    # Run at 13:00 UTC (which is 22:00 JST)
    - cron: '0 13 * * *'
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  scrape_and_upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas google-auth google-auth-oauthlib google-api-python-client openpyxl requests beautifulsoup4

    - name: Run collection script
      env:
        GDRIVE_API_KEY: ${{ secrets.GDRIVE_API_KEY }}
        DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      run: |
        python collect_race_data.py
